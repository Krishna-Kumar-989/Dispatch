version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: dispatch-db
    environment:
      POSTGRES_USER: dispatch_user
      POSTGRES_PASSWORD: dispatch_password
      POSTGRES_DB: dispatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dispatch_user -d dispatch" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dispatch-app
    ports:
      - "8080:8080"
    volumes:
      # Persist uploads outside the container
      - app_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  app_uploads:
